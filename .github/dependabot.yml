# Dependabot version updates — routine dependency bump PRs.
# Security updates are separate: the toggle in Settings → Advanced Security.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # one combined PR for minor/patch bumps instead of a PR per package
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Expo SDK pins these as a matched set — upgrade them together via
    # `npx expo install --fix` when moving SDK versions, not one at a time
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "@react-native*"
      - dependency-name: "react-native-*"
      # Majors only move safely when the Expo SDK does (Aug 2026: babel 8 /
      # jest 30 / RNTL 14 / ts 7 all broke against SDK 57 and were reverted)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x "minors" are breaking (lottie-react-native peers on ^0.13);
      # 0.13→0.19 slipped through the minor-and-patch group and broke web
      - dependency-name: "@lottiefiles/dotlottie-react"
        update-types: ["version-update:semver-minor"]
